# Holt alle 4 Stunden die neuesten YouTube-Videos und speichert sie in data/youtube.json.
# Die Startseite liest diese Datei (siehe js/youtube.js). Manuell starten: Actions → "YouTube-Feed" → Run workflow.
name: YouTube-Feed

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/youtube_feed.py
      - .github/workflows/youtube-feed.yml
      - js/config.js

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Neueste Videos holen
        run: python3 tools/youtube_feed.py

      - name: Änderungen speichern
        run: |
          if [ -z "$(git status --porcelain -- data/youtube.json)" ]; then
            echo "Keine neuen Videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "YouTube-Feed aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
